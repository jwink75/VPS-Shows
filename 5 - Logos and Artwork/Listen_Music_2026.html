<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Listen to the Music</title>
  <style>

<body>
  <img class="logo" src="Vocalpoint%20Logo.svg" alt="Vocalpoint Logo" />
